name: Build APK

# This repository is a "meta" repo: the Android source lives in the `app`
# git submodule (brunodev85/winlator-app), so the checkout must fetch
# submodules and Gradle must run from inside `app/`.

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # Versions below come from app/build.gradle:
      #   compileSdk 35, ndkVersion 24.0.8215888, CMake 3.22.1
      - name: Set up Android SDK, NDK and CMake
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platforms;android-35
            build-tools;35.0.0
            ndk;24.0.8215888
            cmake;3.22.1

      - name: Build debug APK
        working-directory: app
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: winlator-debug-apk
          path: app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
